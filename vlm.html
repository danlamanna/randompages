<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>In-browser VLM</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1a1d21; --muted:#6b7280; --line:#d6d9de; --accent:#2f5bd3; }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark; --bg:#16181c; --fg:#e8eaed; --muted:#9aa0a6; --line:#33373d; --accent:#7ea2ff; }
  }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:24px 16px; display:grid; gap:12px; }
  h1 { font-size:20px; margin:0; }
  #status { color:var(--muted); font-size:14px; }
  img { max-width:100%; max-height:320px; border:1px solid var(--line); display:none; }
  #examples { display:flex; gap:8px; flex-wrap:wrap; }
  #examples button { padding:0; background:none; border:1px solid var(--line); }
  #examples img { display:block; width:72px; height:72px; object-fit:cover; border:0; max-height:none; }
  select { padding:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); font:inherit; justify-self:start; max-width:100%; }
  input[type=text] { width:100%; box-sizing:border-box; padding:8px; border:1px solid var(--line); background:transparent; color:var(--fg); font:inherit; }
  button { padding:8px 14px; border:0; background:var(--accent); color:#fff; font:inherit; cursor:pointer; justify-self:start; }
  button:disabled { opacity:.5; cursor:default; }
  #out { white-space:pre-wrap; border-top:1px solid var(--line); padding-top:12px; min-height:3em; }
</style>
</head>
<body>
<main>
  <h1>In-browser VLM</h1>
  <select id="model"></select>
  <div id="status">Loading…</div>
  <input type="file" id="file" accept="image/*">
  <div>Or try an example:</div>
  <div id="examples"></div>
  <img id="preview" alt="Selected image">
  <input type="text" id="prompt" value="Describe this image.">
  <button id="run" disabled>Ask</button>
  <div id="out"></div>
</main>
<script type="module">
import { AutoProcessor, AutoModelForVision2Seq, Qwen2VLForConditionalGeneration, RawImage, TextStreamer }
  from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1";

const $ = id => document.getElementById(id);
const MODELS = {
  "smol256": { label: "SmolVLM 256M (~250 MB, fastest)", id: "HuggingFaceTB/SmolVLM-256M-Instruct", cls: AutoModelForVision2Seq,
    dtype: { embed_tokens: "fp16", vision_encoder: "q4", decoder_model_merged: "q4" } },
  "smol500": { label: "SmolVLM 500M (~500 MB)", id: "HuggingFaceTB/SmolVLM-500M-Instruct", cls: AutoModelForVision2Seq,
    dtype: { embed_tokens: "fp16", vision_encoder: "q4", decoder_model_merged: "q4" } },
  "qwen2b": { label: "Qwen2-VL 2B (~2.7 GB, best, WebGPU only)", id: "onnx-community/Qwen2-VL-2B-Instruct", cls: Qwen2VLForConditionalGeneration,
    dtype: { embed_tokens: "fp16", vision_encoder: "q4f16", decoder_model_merged: "q4f16" }, qwen: true, gpuOnly: true },
};
const device = navigator.gpu ? "webgpu" : "wasm";
let processor, model, cfg, image, imageUrl;

for (const [k, m] of Object.entries(MODELS)) $("model").add(new Option(m.label, k));

async function loadModel(key) {
  $("run").disabled = true; $("model").disabled = true;
  try { await model?.dispose(); } catch {}
  model = null; cfg = MODELS[key];
  if (cfg.gpuOnly && device !== "webgpu") {
    $("status").textContent = "This model needs WebGPU (use Chrome or Edge).";
    $("model").disabled = false; return;
  }
  $("status").textContent = `Loading ${cfg.label}… (downloads once, then cached)`;
  try {
    processor = await AutoProcessor.from_pretrained(cfg.id);
    model = await cfg.cls.from_pretrained(cfg.id, { dtype: cfg.dtype, device });
    $("status").textContent = `Ready (${device}). ${image ? "" : "Pick an image."}`;
  } catch (e) {
    $("status").textContent = "Model failed to load: " + e.message;
  }
  $("model").disabled = false;
  $("run").disabled = !(model && image);
}
$("model").onchange = e => loadModel(e.target.value);
loadModel("smol256");

async function setImage(url) {
  $("preview").src = url; $("preview").style.display = "block";
  imageUrl = url;
  image = await RawImage.fromURL(url);
  $("run").disabled = !model;
}

for (const ex of EXAMPLES) {
  const b = document.createElement("button");
  b.title = ex.label;
  b.innerHTML = `<img alt="${ex.label}" src="${ex.src}">`;
  b.onclick = () => { $("prompt").value = ex.prompt; setImage(ex.src); };
  $("examples").appendChild(b);
}

$("file").onchange = e => {
  const f = e.target.files[0]; if (f) setImage(URL.createObjectURL(f));
};

$("run").onclick = async () => {
  $("run").disabled = true; $("out").textContent = "";
  const t0 = performance.now();
  const messages = [{ role: "user", content: [{ type: "image" }, { type: "text", text: $("prompt").value }] }];
  const text = processor.apply_chat_template(messages, { add_generation_prompt: true });
  const inputs = cfg.qwen
    ? await processor(text, await image.resize(448, 448))
    : await processor(text, [image], { do_image_splitting: false });
  const streamer = new TextStreamer(processor.tokenizer, {
    skip_prompt: true, skip_special_tokens: true,
    callback_function: t => { $("out").textContent += t; },
  });
  try {
    await model.generate({ ...inputs, max_new_tokens: 300, do_sample: false, streamer });
    $("status").textContent = `Done in ${((performance.now() - t0) / 1000).toFixed(1)}s (${device}).`;
  } catch (e) { $("status").textContent = "Generation failed: " + e.message; }
  $("run").disabled = false;
};
</script>
